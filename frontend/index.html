<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
  <div class="signin-wrapper">
    <div class="signin-container">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" data-tab="signin" onclick="switchTab('signin')">Вход</button>
        <button class="tab" data-tab="register" onclick="switchTab('register')">Регистрация</button>
      </div>

      <!-- Sign In Form -->
      <form id="signinForm" class="auth-form" onsubmit="handleSignin(event)">
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
          </svg>
          <input type="text" id="signinEmail" placeholder="Меня зовут" required autocomplete="username">
        </div>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
          </svg>
          <input type="password" id="signinPassword" placeholder="Пароль" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-submit" id="signinBtn">Войти</button>
        <div class="form-footer">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span class="checkmark"></span>
            Запомнить меня
          </label>
          <a href="#" class="forgot-link">Забыли пароль?</a>
        </div>
        <div class="message" id="signinMessage"></div>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
          </svg>
          <input type="email" id="registerEmail" placeholder="Мой email" required autocomplete="email">
        </div>
        <div class="input-group">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
          </svg>
          <input type="password" id="registerPassword" placeholder="Пароль" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn-submit" id="registerBtn">Зарегистрироваться</button>
        <div class="message" id="registerMessage"></div>
      </form>
    </div>
  </div>

  <script src="/static/app.js?v=3"></script>
</body>
</html>
