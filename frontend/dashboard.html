<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Cabinet</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <!-- Hamburger Button -->
  <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Sidebar Menu -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
      <div class="sidebar-content">
      <div class="sidebar-section">
        <h3>Navigation</h3>
        <a href="/dashboard" class="sidebar-link active">Dashboard</a>
        <a href="/admin" class="sidebar-link">Admin Panel</a>
        <a href="#" class="sidebar-link" id="logoutBtn">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-content">
      <h1>Personal Cabinet</h1>
    </div>
  </header>

  <!-- Main Content -->
  <main class="dashboard-main">
    <div class="profile-card hidden" id="profileCard">
      <div class="profile-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
        </svg>
      </div>
      <div class="profile-info">
        <h2 class="profile-name" id="profileEmail">Loading...</h2>
        <div class="profile-details">
          <div class="detail-row">
            <span class="detail-label">Account ID</span>
            <span class="detail-value" id="profileId">—</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Registered</span>
            <span class="detail-value" id="profileCreated">—</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Status</span>
            <span class="detail-value status-active">Active</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading state -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>

    <!-- Error state -->
    <div class="error-message hidden" id="errorMessage"></div>
  </main>

  <script src="/static/dashboard.js?v=2"></script>
</body>
</html>
