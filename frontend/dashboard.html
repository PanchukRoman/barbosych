<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет</title>
  <link rel="stylesheet" href="/static/style.css?v=12">
</head>
<body>
  <!-- Hamburger Button (mobile) -->
  <button class="hamburger" id="hamburgerBtn" aria-label="Menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Desktop Sidebar Toggle -->
  <button class="desktop-sidebar-toggle" id="desktopSidebarToggle" aria-label="Toggle sidebar">☰</button>

  <!-- Sidebar Menu -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
      <div class="sidebar-content">
      <div class="sidebar-section">
        <h3>Навигация</h3>
        <a href="/dashboard" class="sidebar-link active">Личный кабинет</a>
        <a href="/admin" class="sidebar-link" id="adminLink" style="display: none;">Панель администратора</a>
        <a href="#" class="sidebar-link" id="logoutBtn">Выйти</a>
      </div>
    </div>
  </nav>

  <!-- Header -->
  <header class="dashboard-header">
    <div class="header-content">
      <h1>Личный кабинет</h1>
    </div>
  </header>

  <!-- Main Content -->
  <main class="dashboard-main">
    <!-- Notification Bell -->
    <div class="notification-bell" id="notificationBell" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/>
      </svg>
      <span class="notification-badge" id="notificationBadge">0</span>
    </div>

    <!-- Notification Dropdown -->
    <div class="notification-dropdown hidden" id="notificationDropdown">
      <div class="notification-header">
        <h3>Уведомления</h3>
        <button class="notification-clear" onclick="clearNotifications()">Очистить</button>
      </div>
      <div class="notification-list" id="notificationList">
        <p class="empty-notifications">Нет новых уведомлений</p>
      </div>
    </div>

    <!-- Profile Card -->
    <div class="profile-card hidden" id="profileCard">
      <div class="profile-header">
        <div class="profile-avatar-wrapper">
          <div class="profile-avatar" id="profileAvatar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
            </svg>
          </div>
          <button class="avatar-edit-btn" onclick="document.getElementById('avatarInput').click()" title="Изменить аватар">📷</button>
          <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp" style="display: none;" onchange="uploadAvatar(this)">
        </div>
        <div class="profile-info">
          <h2 class="profile-name" id="profileEmail">Loading...</h2>
          <div class="profile-details">
            <div class="detail-row">
              <span class="detail-label">ID аккаунта</span>
              <span class="detail-value" id="profileId">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Зарегистрирован</span>
              <span class="detail-value" id="profileCreated">—</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">Статус</span>
              <span class="detail-value status-active">Активен</span>
            </div>
          </div>
          <button class="btn-edit-profile" onclick="openEditProfileModal()">Редактировать профиль</button>
        </div>
      </div>
    </div>

    <!-- Dogs Section -->
    <div class="dashboard-section hidden" id="dogsSection">
      <div class="section-header">
        <h2 class="section-title">Мои собаки</h2>
        <button class="btn-primary" onclick="openAddDogModal()">+ Добавить собаку</button>
      </div>
      <div id="dogsList" class="dogs-grid">
        <div class="loading" id="dogsLoading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- Loading state -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
    </div>

    <!-- Error state -->
    <div class="error-message hidden" id="errorMessage"></div>
  </main>

  <!-- Article Detail Modal -->
  <div class="article-modal-overlay hidden" id="articleModal">
    <div class="article-modal">
      <button class="article-modal-close" onclick="closeArticleDetail()">✕</button>
      <div class="article-modal-content">
        <h1 class="article-modal-title" id="articleModalTitle">Загрузка...</h1>
        <div class="article-modal-meta">
          <span class="article-modal-date" id="articleModalDate"></span>
        </div>
        <div class="article-modal-body" id="articleModalBody"></div>
      </div>
    </div>
  </div>

  <!-- Event Detail Modal -->
  <div class="event-modal-overlay hidden" id="eventModal">
    <div class="event-modal">
      <button class="event-modal-close" onclick="closeEventDetail()">✕</button>
      <div class="event-modal-content">
        <h1 class="event-modal-title" id="eventModalTitle">Загрузка...</h1>
        <div class="event-modal-meta">
          <span class="event-modal-date" id="eventModalDate"></span>
          <span class="event-modal-location" id="eventModalLocation"></span>
          <span class="event-modal-participants" id="eventModalParticipants"></span>
        </div>
        <div class="event-modal-body" id="eventModalBody"></div>
        
        <!-- Participants List -->
        <div class="participants-section" id="participantsSection" style="display: none;">
          <h3 class="participants-title">Участники</h3>
          <div id="participantsList" class="participants-list"></div>
        </div>
        
        <div class="event-modal-actions" id="eventModalActions"></div>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay hidden" id="editProfileModal">
    <div class="modal">
      <button class="modal-close" onclick="closeEditProfileModal()">✕</button>
      <h2>Редактировать профиль</h2>
      <form id="editProfileForm" onsubmit="saveProfile(event)">
        <div class="form-group">
          <label for="editEmail">Email</label>
          <input type="email" id="editEmail" required>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="saveProfileBtn">Сохранить</button>
          <button type="button" class="btn-secondary" onclick="closeEditProfileModal()">Отмена</button>
        </div>
        <div class="message" id="profileMessage"></div>
      </form>
    </div>
  </div>

  <!-- Add/Edit Dog Modal -->
  <div class="modal-overlay hidden" id="dogModal">
    <div class="modal">
      <button class="modal-close" onclick="closeDogModal()">✕</button>
      <h2 id="dogModalTitle">Добавить собаку</h2>
      <form id="dogForm" onsubmit="saveDog(event)">
        <input type="hidden" id="dogId">
        <div class="form-group">
          <label for="dogName">Кличка</label>
          <input type="text" id="dogName" required placeholder="Кличка собаки" maxlength="100">
        </div>
        <div class="form-group">
          <label for="dogBreed">Порода</label>
          <input type="text" id="dogBreed" required placeholder="Порода" maxlength="100">
        </div>
        <div class="form-group">
          <label for="dogAge">Возраст (лет)</label>
          <input type="number" id="dogAge" required min="0" max="30" placeholder="0">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary" id="saveDogBtn">Сохранить</button>
          <button type="button" class="btn-secondary" onclick="closeDogModal()">Отмена</button>
        </div>
        <div class="message" id="dogMessage"></div>
      </form>
    </div>
  </div>

  <script src="/static/dashboard.js?v=10"></script>
</body>
</html>
